{% extends 'cliente/base.html' %}

{% block title %}Iniciar Sesión | Hierros Nazareno{% endblock %}

{% block content %}
<!-- TODO LO QUE ESTÉ AQUÍ ADENTRO SE VERÁ EN LA PÁGINA -->
<main class="max-w-md mx-auto mt-12 bg-white p-8 rounded-lg shadow-md border border-gray-200">
    <h2 class="text-2xl font-black text-[#1E3A8A] text-center mb-6">Iniciar Sesión</h2>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div class="space-y-4">
            {% for field in form %}
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-700 mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5" {% if field.field.required %}required{% endif %}>
                    
                    {% for error in field.errors %}
                        <p class="text-xs text-red-600 mt-1 font-semibold">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
        </div>
        
        <button type="submit" class="w-full bg-[#2563EB] hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-md transition mt-6">
            Ingresar
        </button>
    </form>
    
    <div class="mt-6 text-center text-sm text-gray-600">
        ¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-blue-600 font-bold hover:underline">Regístrate aquí</a>
    </div>
</main>
{% endblock %}
