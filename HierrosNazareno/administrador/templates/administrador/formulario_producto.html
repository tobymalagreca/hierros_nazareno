{% extends 'cliente/base.html' %}

{% block title %}{{ accion }} | Administrador{% endblock %}

{% block content %}
<main class="max-w-3xl mx-auto mt-8 mb-10 bg-white p-6 rounded-lg shadow-md border border-gray-200">
    <div class="flex items-center gap-3 mb-6 border-b border-gray-100 pb-4">
        <a href="{% url 'dashboard_admin' %}" class="text-gray-400 hover:text-[#1E3A8A] transition">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </a>
        <h2 class="text-2xl font-black text-[#1E3A8A]">{{ accion }} Producto</h2>
    </div>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for field in form %}
                <div class="flex flex-col {% if field.name == 'nombre' or field.name == 'disponible' %}md:col-span-2{% endif %}">
                    <label class="text-sm font-semibold text-gray-700 mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    
                    <div class="flex items-center gap-2">
                        {{ field }}
                    </div>
                    
                    {% if field.errors %}
                        <p class="text-xs text-red-600 mt-1 font-semibold">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        
        <div class="flex justify-end gap-3 mt-8 pt-5 border-t border-gray-100">
            <a href="{% url 'dashboard_admin' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2.5 px-6 rounded-md transition">Cancelar</a>
            <button type="submit" class="bg-[#2563EB] hover:bg-blue-700 text-white font-bold py-2.5 px-8 rounded-md transition shadow-sm">
                Guardar
            </button>
        </div>
    </form>
</main>
{% endblock %}
